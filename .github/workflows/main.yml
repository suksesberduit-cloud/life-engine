name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak life-engine.zip
        run: unzip -o life-engine.zip -d src
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dan buat proyek Android
        working-directory: src
        run: |
          npm install
          npx cap add android
          cp -r android-res/. android/app/src/main/res/
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          grep -q RECORD_AUDIO $M || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n</manifest>#' $M
      - name: Build debug APK
        working-directory: src/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: life-engine-debug-apk
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
